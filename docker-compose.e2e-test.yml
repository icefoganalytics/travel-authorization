services:
  api:
    ports: !reset []
    volumes:
      - end_to_end_tests_api_node_modules:/usr/src/api/node_modules
    environment:
      NODE_ENV: test
      DB_NAME: travel_test
      TRAVCOM_DB_NAME: trav_com_test
      DEFAULT_LOG_LEVEL: "warn"
      YUKON_GOVERNMENT_FINANCE_API_BASE_URL: http://finance_api_stub:3000
    depends_on:
      db:
        condition: service_started
      db_trav_com:
        condition: service_started
      finance_api_stub:
        condition: service_healthy
  test_api:
    env_file: !reset []
    volumes: !reset []
  web:
    ports: !reset []
    volumes:
      - end_to_end_tests_web_node_modules:/usr/src/web/node_modules
    environment:
      VITE_API_BASE_URL: http://api:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:8080").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  end_to_end_tests:
    user: "${HOST_USER_ID:-0}:${HOST_GROUP_ID:-0}"
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://localhost:8080
      API_BASE_URL: http://api:3000
      CI: "${CI:-}"
      NODE_ENV: test
      DB_NAME: travel_test
      TRAVCOM_DB_NAME: trav_com_test

  finance_api_stub:
    build:
      context: ./api
      dockerfile: end-to-end-tests/Dockerfile
    command: node end-to-end-tests/finance-api-stub.js
    healthcheck:
      test: ["CMD", "node", "-e", 'fetch("http://localhost:3000/health").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 2s
      timeout: 2s
      retries: 30
  db:
    ports: !reset []
    volumes:
      - /tmp/e2e-test-db-postgres:/var/lib/postgresql/data
  db_trav_com:
    ports: !reset []
    volumes:
      - /tmp/e2e-test-db-mssql:/var/opt/mssql/data

volumes:
  end_to_end_tests_api_node_modules:
  end_to_end_tests_web_node_modules:
