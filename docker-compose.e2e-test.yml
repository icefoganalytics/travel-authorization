services:
  api:
    env_file: !reset []
    environment:
      NODE_ENV: test
      DB_NAME: travel_test
      TRAVCOM_DB_NAME: trav_com_test
      DEFAULT_LOG_LEVEL: "warn"
      YUKON_GOVERNMENT_FINANCE_API_BASE_URL: http://finance_api_stub:3000
    depends_on: !override
      db:
        condition: service_started
      db_trav_com:
        condition: service_started
      finance_api_stub:
        condition: service_healthy
    ports: !reset []
    volumes: !reset []

  test_api:
    env_file: !reset []
    volumes: !reset []

  web:
    environment:
      VITE_API_BASE_URL: http://api:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:8080").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    ports: !reset []
    volumes: !reset []

  db:
    environment:
      POSTGRES_DB: travel_test
    ports: !reset []

  db_trav_com:
    ports: !reset []
