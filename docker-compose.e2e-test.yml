services:
  api:
    env_file: !reset []
    environment:
      NODE_ENV: test
      DB_NAME: travel_test
      TRAVCOM_DB_NAME: trav_com_test
      FRONTEND_URL: http://localhost:8080
      DEFAULT_LOG_LEVEL: "warn"
      YUKON_GOVERNMENT_FINANCE_API_BASE_URL: http://finance_api_stub:3000
    volumes: !reset []
    ports: !reset []
    depends_on: !override
      db:
        condition: service_healthy
      db_trav_com:
        condition: service_healthy
      finance_api_stub:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:3000/_status").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 5s

  web:
    environment:
      NODE_ENV: test
      FRONTEND_URL: http://localhost:8080
      VITE_API_BASE_URL: http://api:3000
      OPEN_IN_EDITOR_BRIDGE_ENABLED: "false"
      OPEN_IN_EDITOR_SESSION_ID: ""
    volumes: !reset []
    ports: !reset []
    depends_on: !override
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:8080").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  test_api:
    env_file: !reset []

  db:
    environment:
      POSTGRES_DB: travel_test
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  db_trav_com:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b',
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  end_to_end_tests:
    extends:
      file: docker-compose.development.yml
      service: api
    image: travel-authorization-e2e-tests
    build:
      context: .
      dockerfile: end-to-end-tests/Dockerfile
    network_mode: service:web
    shm_size: 1gb
    env_file: !reset []
    environment:
      NODE_ENV: test
      DB_NAME: travel_test
      TRAVCOM_DB_NAME: trav_com_test
      DEFAULT_LOG_LEVEL: "warn"
      BASE_URL: http://localhost:8080
      API_BASE_URL: http://api:3000
      CI: "${CI:-}"
      E2E_AUTHENTICATED: "${E2E_AUTHENTICATED:-false}"
      TRAVELLER_EMAIL: "${TRAVELLER_EMAIL:-}"
      TRAVELLER_PASSWORD: "${TRAVELLER_PASSWORD:-}"
      SUPERVISOR_EMAIL: "${SUPERVISOR_EMAIL:-}"
      SUPERVISOR_PASSWORD: "${SUPERVISOR_PASSWORD:-}"
      TRAVEL_DESK_EMAIL: "${TRAVEL_DESK_EMAIL:-}"
      TRAVEL_DESK_PASSWORD: "${TRAVEL_DESK_PASSWORD:-}"
      FINANCE_EMAIL: "${FINANCE_EMAIL:-}"
      FINANCE_PASSWORD: "${FINANCE_PASSWORD:-}"
    volumes: !override
      - ./end-to-end-tests:/usr/src/end-to-end-tests
      - ./.gitignore:/usr/src/.gitignore:ro
    ports: !reset []
    depends_on: !override
      web:
        condition: service_healthy
    profiles:
      - e2e-test
    healthcheck:
      test: ["NONE"]

  finance_api_stub:
    image: travel-authorization-e2e-tests
    command: npm run ts-node -- finance-api-stub.ts
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:3000/health").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles:
      - e2e-test
