<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Out-of-Territory Travel Desk Report</title>
    <style>
      @page {
        size: letter landscape;
        margin: 10mm 8mm 15mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #202020;
        font-family: Arial, sans-serif;
      }

      thead {
        display: table-header-group;
        break-inside: avoid;
      }

      .report-title {
        border: 0;
        padding: 0;
      }

      .report-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 10px;
        border-bottom: 2px solid #f2a900;
        padding: 0 0 8px;
      }

      .report-heading img {
        width: 82px;
        height: auto;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 7.5pt;
      }

      th,
      td {
        border: 1px solid #777;
        padding: 4px 3px;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      th {
        background: #eeeeee;
        font-weight: 700;
      }

      tr {
        break-inside: avoid;
      }

      col:nth-child(1),
      col:nth-child(5),
      col:nth-child(6) {
        width: 8%;
      }

      col:nth-child(2) {
        width: 12%;
      }

      col:nth-child(3) {
        width: 11%;
      }

      col:nth-child(4) {
        width: 10%;
      }

      col:nth-child(7) {
        width: 14%;
      }

      col:nth-child(8),
      col:nth-child(9) {
        width: 9%;
      }

      col:nth-child(10) {
        width: 11%;
      }
    </style>
  </head>
  <body>
    <table>
      <colgroup>
        <% headers.forEach(() => { %>
        <col />
        <% }) %>
      </colgroup>
      <thead>
        <tr>
          <td
            class="report-title"
            colspan="<%- headers.length %>"
          >
            <header class="report-heading">
              <img
                src="<%- logoDataUri %>"
                alt="Yukon Government"
              />
              <h1>Out-of-Territory Travel Desk Report</h1>
            </header>
          </td>
        </tr>
        <tr>
          <% headers.forEach((header) => { %>
          <th scope="col"><%- header %></th>
          <% }) %>
        </tr>
      </thead>
      <tbody>
        <% rows.forEach((row) => { %>
        <tr>
          <% headers.forEach((header) => { %>
          <td><%- row[header] %></td>
          <% }) %>
        </tr>
        <% }) %>
      </tbody>
    </table>
  </body>
</html>
